name: Validate FABLEBRINK server source

on:
  push:
    branches: [main, master]
    paths:
      - 'server/**'
      - '.github/workflows/server-check.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: npm --prefix server run check
