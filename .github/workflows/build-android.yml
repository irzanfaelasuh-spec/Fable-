name: Build FABLEBRINK Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - '**.gd'
      - '**.tscn'
      - '**.tres'
      - 'project.godot'
      - 'export_presets.cfg'
      - 'assets/**'
      - '.github/workflows/build-android.yml'

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # FIX: Do not install the obsolete "tools" SDK package.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Download Godot 4.7.2
        run: |
          curl -L --fail --retry 3 -o godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip

          unzip -q godot.zip

          sudo install -m 0755 \
            Godot_v4.7.2-stable_linux.x86_64 \
            /usr/local/bin/godot

          godot --version

      - name: Install Godot export templates
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"

          curl -L --fail --retry 3 -o templates.tpz \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_export_templates.tpz

          unzip -q templates.tpz -d "$RUNNER_TEMP/godot-templates"

          if [ -d "$RUNNER_TEMP/godot-templates/templates" ]; then
            cp -a "$RUNNER_TEMP/godot-templates/templates/." \
              "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          else
            cp -a "$RUNNER_TEMP/godot-templates/." \
              "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
          fi

          if [ ! -f "$HOME/.local/share/godot/export_templates/4.7.2.stable/version.txt" ]; then
            printf '4.7.2.stable' \
              > "$HOME/.local/share/godot/export_templates/4.7.2.stable/version.txt"
          fi

      - name: Configure Godot Android paths
        run: |
          mkdir -p "$HOME/.config/godot"

          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF2
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF2

      - name: Create temporary debug signing key
        run: |
          mkdir -p "$HOME/.android"

          keytool -genkeypair -v \
            -keystore "$HOME/.android/fablebrink-debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/fablebrink-debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"

      - name: Import project and export signed debug APK
        run: |
          mkdir -p build

          godot --headless --editor --path . --import

          godot --headless --path . \
            --export-debug "Android" \
            build/FABLEBRINK-debug.apk

          test -s build/FABLEBRINK-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FABLEBRINK-Android-debug
          path: build/FABLEBRINK-debug.apk
          if-no-files-found: error
          retention-days: 14
